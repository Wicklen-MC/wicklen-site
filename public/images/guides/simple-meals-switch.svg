<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 540" width="100%" height="100%" role="img" aria-labelledby="title"><title id="title">Замена бонуса блюда без замены посторонних эффектов</title><rect width="1280" height="540" rx="28" fill="#fff7ef"/><text x="56" y="68" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="34" font-weight="650">Другой обед заменяет только бонус Simple Meals</text><rect x="40" y="110" width="550" height="280" rx="20" fill="#e7ecdf"/><image href="data:image/png;base64," x="80" y="155" width="96" height="96" style="image-rendering:pixelated"/><text x="215" y="195" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="29" font-weight="650">Похлёбка</text><text x="215" y="245" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="26" font-weight="400">Быстрее добыча</text><text x="215" y="300" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="26" font-weight="400">10 минут</text><text x="613" y="255" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="48" font-weight="650">→</text><rect x="690" y="110" width="550" height="280" rx="20" fill="#eee4ed"/><image href="data:image/png;base64," x="730" y="155" width="96" height="96" style="image-rendering:pixelated"/><text x="865" y="195" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="29" font-weight="650">Суп</text><text x="865" y="245" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="26" font-weight="400">+2 брони</text><text x="865" y="300" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="26" font-weight="400">10 минут заново</text><text x="56" y="443" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="25" font-weight="400">Зелья сохраняются при смене блюда. Молоко снимает эффекты обычным способом.</text><text x="56" y="490" fill="#4d3b47" font-family="system-ui,sans-serif" font-size="25" font-weight="400">Повтор того же блюда обновляет время. Есть можно и при полном голоде.</text></svg>
