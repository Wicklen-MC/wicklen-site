<dialog class="image-viewer" id="image-viewer" aria-labelledby="image-viewer-title" aria-describedby="image-viewer-caption">
  <div class="image-viewer-toolbar"><h2 id="image-viewer-title">Игровой скриншот</h2><span id="image-viewer-count" aria-live="polite"></span><button type="button" data-image-close autofocus>Закрыть</button></div>
  <figure><img id="image-viewer-image" alt=""><figcaption id="image-viewer-caption"></figcaption></figure>
  <div class="image-viewer-controls"><button type="button" data-image-prev>Предыдущий</button><a id="image-viewer-original" target="_blank" rel="noopener noreferrer">Открыть оригинал</a><button type="button" data-image-next>Следующий</button></div>
</dialog>
